<ng-container *transloco="let t">
  <header class="titlebar" [class.titlebar--native-controls]="isElectron">
    <span class="titlebar__name">Game Launcher</span>
    <span class="titlebar__env" [attr.data-electron]="isElectron">
      {{ isElectron ? 'Electron shell' : 'Browser' }}
    </span>

    <!--
      Moves into the settings page in stage 6, where the choice also becomes
      persistent. It is here rather than nowhere so the two dictionaries are
      reachable instead of merely present.
    -->
    <div class="langswitch" role="group" aria-label="Language">
      @for (language of languages; track language) {
        <button
          type="button"
          class="langswitch__option"
          [class.langswitch__option--active]="currentLanguage() === language"
          [attr.aria-pressed]="currentLanguage() === language"
          (click)="useLanguage(language)"
        >
          {{ language.toUpperCase() }}
        </button>
      }
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" [attr.aria-label]="t('nav.sectionLibrary')">
      <p class="sidebar__section">{{ t('nav.sectionLibrary') }}</p>
      <a
        class="sidebar__link"
        routerLink="/discover"
        routerLinkActive="sidebar__link--active"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        {{ t('nav.discover') }}
      </a>

      <p class="sidebar__section">{{ t('nav.sectionSystem') }}</p>
      <a class="sidebar__link" routerLink="/diagnostics" routerLinkActive="sidebar__link--active">
        {{ t('nav.diagnostics') }}
      </a>
    </nav>

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</ng-container>
