<ng-container *transloco="let t">
  <!--
    aria-pressed carries the state, so the accessible name stays the same in
    both -- a label that flipped between "add" and "remove" alongside a
    pressed state announces the change twice and contradicts itself halfway.
  -->
  <button
    type="button"
    class="favourite"
    [class.favourite--on]="isFavourite()"
    [class.favourite--labelled]="withLabel()"
    [attr.aria-pressed]="isFavourite()"
    [attr.aria-label]="withLabel() ? null : t('favourite.action', { title: gameTitle() })"
    [attr.title]="t('favourite.action', { title: gameTitle() })"
    (click)="toggle()"
  >
    <!--
      One path, filled or merely outlined. Drawing the empty and full hearts
      as two different shapes would make them wobble as the state changes.
    -->
    <svg class="favourite__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        d="M12 20.4 10.6 19.1C6 14.9 3 12.2 3 8.8 3 6.1 5.1 4 7.8 4c1.5 0 3 .7 4.2 2.1C13.2 4.7 14.7 4 16.2 4 18.9 4 21 6.1 21 8.8c0 3.4-3 6.1-7.6 10.3L12 20.4z"
      />
    </svg>

    @if (withLabel()) {
      <span class="favourite__label">
        {{ isFavourite() ? t('favourite.saved') : t('favourite.save') }}
      </span>
    }
  </button>
</ng-container>
