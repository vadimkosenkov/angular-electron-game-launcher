# electron-builder configuration.
#
# Kept as YAML rather than a "build" key in package.json so that the reasoning
# can live next to the settings. Everything below is a decision, not a default.

appId: com.vadimkosenkov.gamelauncher
productName: Game Launcher
copyright: Copyright © 2026 Vadim Kosenkov

directories:
  output: release
  # Where the icon generated by `npm run icon` is found.
  buildResources: build

# What goes inside the application bundle.
#
# Listed explicitly rather than filtered down from everything: the repository
# holds a dev server, scripts, screenshots and the whole Angular source tree,
# and none of it belongs in a shipped application. Production dependencies are
# added on top of this list by electron-builder itself, which is why moving
# Angular to devDependencies is what keeps them out -- the renderer is already
# compiled into dist/.
files:
  - dist/game-launcher/browser/**
  - dist-node/**
  - package.json
  # Source maps describe code nobody can step through in a packaged build.
  - '!**/*.map'

# No native modules, so there is nothing to rebuild against Electron's ABI and
# no reason to spend a minute discovering that.
npmRebuild: false

mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.entertainment
  icon: build/icon.icns
  # The window follows the system appearance, so the bundle has to admit it
  # understands dark mode -- without this macOS draws the title bar light.
  darkModeSupport: true

  # No Developer ID certificate exists for this project, so electron-builder
  # has nothing to sign with and is told so explicitly rather than left to
  # search the keychain and pick something.
  #
  # What it leaves behind still needs fixing, which is what afterPack does:
  # Electron's own binary arrives ad-hoc signed by its linker, so a bundle
  # with no seal of its own is internally inconsistent and macOS calls a
  # downloaded copy damaged. See scripts/ad-hoc-sign.mjs.
  identity: null

# Gives the bundle an ad-hoc signature of its own. Replacing `identity` above
# with a Developer ID and adding notarisation would make this step redundant,
# and that is the only change needed.
afterPack: scripts/ad-hoc-sign.mjs

dmg:
  # The familiar pair: the application on the left, a link to Applications on
  # the right, so the installation gesture is a drag.
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
